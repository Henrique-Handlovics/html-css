<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: salmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.itens{
            background-color: lightblue;
            text-align: center;
            border: 1px solid black;
        }

        div#cxA{
            flex: 0 1 200px;
        }

        div#cxB{
            flex: 1 1 150px;
        }

        div#cxC{
            flex: 3 1 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens" id="cxA">A</div>
        <div class="itens" id="cxB">B</div>
        <div class="itens" id="cxC">C</div>
    </div>
</body>
</html>
