<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: salmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.itens{
            background-color: lightblue;
            text-align: center;
            border: 1px solid black;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="itens">A</div>
        <div class="itens">outro conteúdo</div>
        <div class="itens">aaaaaaaaaaaaaaaaaaakakakakskakskasa</div>
        <div class="itens">D</div>
        <div class="itens">E</div>
        <div class="itens">akdjakjdakjdkajdkajdka</div>
        <div class="itens">G</div>
    </div>
</body>
</html>
